[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hd-image-ppt-builder"
version = "1.0.0"
description = "Convert PowerPoint slides to high-resolution images, then rebuild as a layout-locked PPTX with speaker notes preserved"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.21",
    "Pillow>=9.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
hd-pptx = "hd_pptx:main"

[tool.setuptools]
py-modules = ["hd_pptx", "hd_pptx_gui"]
